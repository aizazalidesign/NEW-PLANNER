</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><span class="brandmark">✳</span>daylume<span style="color:#d8dfaa">.</span></div><div class="brand-caption">MAKE ROOM FOR LIFE</div><div class="navlabel">YOUR PERSONAL SPACE</div><nav class="nav" id="nav"></nav><div class="sidefoot"><div style="padding:16px;background:#ffffff0b;border-radius:12px;font-family:Georgia,serif;font-size:17px">Little steps.<br>Brighter days. <span style="color:#d8dfaa">↗</span></div><div class="localbadge"><b>●</b> Saved on this browser<br><span style="font-size:10px">Your space. Your own pace.</span></div></div></aside><main class="main"><header class="topbar"><button class="menu ghost" aria-label="Open navigation" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div class="searchwrap"><span>⌕</span><input class="search" id="search" aria-label="Search planner" placeholder="Find a task, note or little idea…"></div><div class="topright"><button class="ghost desktop" onclick="window.print()">↗ Print page</button><button class="ghost" aria-label="Toggle dark theme" onclick="toggleDark()">◐</button><div class="avatar" id="avatar">Y</div></div></header><div class="content" id="content"></div><footer class="footer"><span>DAYLUME • A LITTLE SPACE FOR YOUR WHOLE LIFE</span><span id="saveStatus">Local-first · No account needed</span></footer></main></div><dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" class="toast" hidden role="status"></div><input type="file" id="restoreFile" accept="application/json,.json" hidden>
<script>
'use strict';
const $=s=>document.querySelector(s),KEY='daylume-planner-v1',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const today=dateKey();function plusDay(n,base=today){let d=new Date(base+'T12:00:00');d.setDate(d.getDate()+n);return dateKey(d)}function niceDate(v){return v?new Date(v+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'No date'}
function fresh(){return {version:1,settings:{name:'',currency:'USD',theme:'forest',dark:false,budget:1000},tasks:[],events:[],habits:[],goals:[],notes:[],links:[],transactions:[],focusSessions:0,journal:{}}};let data=fresh(),storageOK=true;try{let raw=localStorage.getItem(KEY);if(raw)data=validate(JSON.parse(raw))}catch(e){storageOK=false}
function validate(d){if(!d||d.version!==1||!d.settings)throw Error('Not a Daylume backup');let base=fresh();for(let k of ['tasks','events','habits','goals','notes','links','transactions']){if(!Array.isArray(d[k])||d[k].length>20000)throw Error('Invalid records');for(let x of d[k]){if(!x||typeof x.id!=='string'||!/^[-a-zA-Z0-9_]+$/.test(x.id)||typeof x.title!=='string')throw Error('Invalid record');for(let prop of ['date','time','category','priority','repeat','body','url','description','unit','location'])if(x[prop]!=null&&typeof x[prop]!=='string')throw Error('Invalid text');if(x.date&&!/^\d{4}-\d{2}-\d{2}$/.test(x.date))throw Error('Invalid date');if(k==='habits'&&(!Array.isArray(x.days)||x.days.some(t=>typeof t!=='string')))throw Error('Invalid habit');if(k==='transactions'&&(!Number.isFinite(x.amount)||x.amount<0||!['income','expense'].includes(x.type)))throw Error('Invalid transaction');if(k==='goals'&&(!Number.isFinite(x.target)||x.target<=0||!Number.isFinite(x.current)||x.current<0))throw Error('Invalid goal')}}if(!['USD','GBP','EUR','CAD','AUD','PKR','INR'].includes(d.settings.currency))throw Error('Invalid currency');return {...base,...d,settings:{...base.settings,...d.settings}}}
let page='Overview',filter='All',searchText='',calDate=new Date(),selectedDay=today,timerRemaining=25*60,timerRunning=false,timerEnd=0,timerId=null;
const navItems=[['Overview','◫'],['Tasks','✓'],['Calendar','▦'],['Habits','◌'],['Goals','⚑'],['Money','↗'],['Notes','▤'],['Bookmarks','♧'],['Focus','◷'],['Settings','⚙']];
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));storageOK=true;$('#saveStatus').textContent='Saved locally · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){storageOK=false;$('#saveStatus').textContent='Storage unavailable — export a backup';toast('Could not save in this browser. Export a backup to keep your changes.')}}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>$('#toast').hidden=true,4000)}
function theme(){let palettes={forest:['#183f38','#286457','#e6eee5','#f1d5bd'],ocean:['#1d3854','#32658b','#e4edf3','#e5dfef'],plum:['#432c46','#785373','#eee5ed','#efdbcd']};let p=palettes[data.settings.theme]||palettes.forest;document.body.classList.toggle('dark',!!data.settings.dark);for(let [i,k] of ['--nav','--accent','--soft','--peach'].entries())document.documentElement.style.setProperty(k,p[i]);if(data.settings.dark){document.documentElement.style.setProperty('--accent','#b8d6ba');document.documentElement.style.setProperty('--soft','#2d463b');document.documentElement.style.setProperty('--peach','#574535')}$('#avatar').textContent=(data.settings.name||'You').charAt(0).toUpperCase()}
function toggleDark(){data.settings.dark=!data.settings.dark;save();theme()}
function go(p){page=p;searchText='';$('#search').value='';filter='All';$('#sidebar').classList.remove('open');render()}
function render(){theme();$('#nav').innerHTML=navItems.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span><span>${n}</span></button>`).join('');if(searchText){renderSearch();return}let views={Overview:overview,Tasks:tasksView,Calendar:calendarView,Habits:habitsView,Goals:goalsView,Money:moneyView,Notes:notesView,Bookmarks:linksView,Focus:focusView,Settings:settingsView};$('#content').innerHTML=views[page]();if(page==='Focus')updateClock()}
function header(title,sub,action='',label=''){return `<div class="pagehead"><div><div class="eyebrow muted" style="margin-bottom:8px">${page==='Overview'?new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'}):'YOUR PERSONAL SPACE / '+esc(page)}</div><h1>${title}</h1><p class="muted">${sub}</p></div>${action?`<button class="primary" onclick="${action}">＋ ${label}</button>`:''}</div>`}
function empty(s){return `<div class="empty">${s}</div>`}function cash(n){return new Intl.NumberFormat(undefined,{style:'currency',currency:data.settings.currency,maximumFractionDigits:2}).format(n)}function currentTx(){let m=today.slice(0,7);return data.transactions.filter(x=>(x.date||'').startsWith(m))}function balance(){return currentTx().reduce((a,x)=>a+(x.type==='income'?x.amount:-x.amount),0)}function week(){let d=new Date(today+'T12:00:00');let offset=(d.getDay()+6)%7;return Array.from({length:7},(_,i)=>plusDay(i-offset))}
function taskRow(x){return `<div class="item ${x.done?'done':''}"><input class="check" type="checkbox" aria-label="Complete ${esc(x.title)}" ${x.done?'checked':''} onchange="toggleTask('${esc(x.id)}')"><div class="itembody"><div class="itemtitle">${esc(x.title)}</div><small>${esc(x.category||'Personal')} ${x.date?'· '+niceDate(x.date):''}${x.date<today&&!x.done&&x.date?' · Overdue':''}</small></div><span class="pill ${esc(x.priority)}">${esc(x.priority||'low')}</span><button class="small ghost" aria-label="Edit task" onclick="edit('tasks','${esc(x.id)}')">✎</button></div>`}
function overview(){let done=data.tasks.filter(t=>t.done).length,active=data.tasks.length-done,hDone=data.habits.filter(h=>h.days.includes(today)).length;let due=data.tasks.filter(t=>!t.done&&(!t.date||t.date<=selectedDay)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).slice(0,5);let upcoming=data.events.filter(e=>e.date>=today).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,3);let goals=data.goals.slice(0,2);return header(`A fresh page${data.settings.name?', '+esc(data.settings.name):''}.`,'A little intention. A little progress. A day that feels like yours.',"edit('tasks')",'New task')+`<section class="hero"><div><div class="eyebrow">A MOMENT TO BEGIN AGAIN</div><h2>Make space for what matters.</h2><p>Bring your plans, routines and little ideas together.</p></div><div class="sunart" aria-hidden="true"><span>✳</span></div></section><div class="stats"><div class="stat"><div class="row between"><span>OPEN TASKS</span><span class="doticon">✓</span></div><div class="num">${active}<small> to make room for</small></div><small>${done} completed · one step at a time</small></div><div class="stat"><div class="row between"><span>TODAY'S HABITS</span><span class="doticon" style="background:var(--lav)">◌</span></div><div class="num">${hDone}<small> / ${data.habits.length} checked in</small></div><small>Consistency over perfection</small></div><div class="stat"><div class="row between"><span>ACTIVE GOALS</span><span class="doticon" style="background:var(--peach)">⚑</span></div><div class="num">${data.goals.filter(g=>g.current<g.target).length}<small> possibilities ahead</small></div><small>Small steps. Real progress.</small></div><div class="stat"><div class="row between"><span>MONTHLY BALANCE</span><span class="doticon">↗</span></div><div class="num" style="font-size:25px">${cash(balance())}</div><small>Recorded income minus expenses</small></div></div><div class="grid"><div class="stack"><section class="card"><div class="cardhead"><h2>Your daily rhythm</h2><button class="small ghost" onclick="go('Tasks')">All tasks ↗</button></div><div class="weekstrip">${week().map(d=>`<button class="${d===selectedDay?'active':''}" onclick="selectedDay='${d}';render()">${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}<b>${Number(d.slice(-2))}</b></button>`).join('')}</div><div class="row between"><small>Open tasks due by ${niceDate(selectedDay)}</small><span class="pill">${due.length} shown</span></div>${due.map(taskRow).join('')||empty('A little breathing room.<br>Add your first task to begin.')}</section><section class="card"><div class="cardhead"><h2>Little habits, lasting change</h2><button class="small ghost" onclick="go('Habits')">View habits ↗</button></div>${habitTable(data.habits.slice(0,3))}</section><div class="quick"><button onclick="edit('notes')"><span>＋</span>Capture an idea</button><button onclick="edit('events')"><span>▦</span>Plan an event</button><button onclick="edit('transactions')"><span>↗</span>Track spending</button><button onclick="go('Focus')"><span>◷</span>Find your focus</button></div></div><div class="stack"><section class="card"><div class="cardhead"><h2>Coming up</h2><span class="pill">AGENDA</span></div>${upcoming.map(e=>`<div class="item"><div class="doticon" style="height:42px;width:42px;font-family:Georgia">${Number(e.date.slice(-2))}</div><div class="itembody"><div class="itemtitle">${esc(e.title)}</div><small>${niceDate(e.date)} · ${esc(e.time||'All day')}</small></div><button class="small ghost" aria-label="Edit event" onclick="edit('events','${esc(e.id)}')">↗</button></div>`).join('')||empty('Your calendar is open.<br>Make room for something good.')}</section><section class="card"><div class="cardhead"><h2>Growing toward</h2><button class="small ghost" onclick="go('Goals')">Goals ↗</button></div>${goals.map(g=>`<div style="margin:16px 0"><div class="row between"><span>${esc(g.title)}</span><small>${Math.min(100,Math.round(g.current/g.target*100))}%</small></div><div class="progress"><span style="width:${Math.min(100,g.current/g.target*100)}%"></span></div></div>`).join('')||empty('Give a dream a little direction.<br>Create a goal when you are ready.')}</section><section class="quote"><div class="eyebrow">A GENTLE REMINDER</div><p>“You don’t need to do it all.<br>Just the next meaningful thing.”</p><small>A LITTLE KINDNESS GOES A LONG WAY</small></section></div></div>`}
function tasksView(){let list=data.tasks.filter(t=>filter==='All'||filter==='Completed'&&t.done||filter==='Open'&&!t.done||filter==='Today'&&t.date===today||filter==='Overdue'&&!t.done&&t.date&&t.date<today);list.sort((a,b)=>Number(a.done)-Number(b.done)||(a.date||'9999').localeCompare(b.date||'9999'));return header('Clear your mind.','Turn the things on your mind into small, doable steps.',"edit('tasks')",'New task')+`<div class="tabs">${['All','Open','Today','Overdue','Completed'].map(t=>`<button class="${filter===t?'active':''}" onclick="filter='${t}';render()">${t}</button>`).join('')}</div><div class="card">${list.map(taskRow).join('')||empty('No tasks here yet. Add a task with a date, priority and category.')}</div>`}
function toggleTask(id){let x=data.tasks.find(t=>t.id===id);x.done=!x.done;if(x.done&&x.repeat&&x.repeat!=='none'&&!data.tasks.some(t=>t.parentId===x.id)){let next={...x,id:uid(),parentId:x.id,done:false,date:plusDay(x.repeat==='daily'?1:7,x.date||today)};data.tasks.push(next)}save();render()}
function calendarView(){let y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),offset=(first.getDay()+6)%7;let days=Array.from({length:42},(_,i)=>new Date(y,m,i-offset+1));return header('Make room for moments.','Your events and dated tasks, together in one calm view.',"edit('events')",'New event')+`<div class="card"><div class="cardhead"><h2>${calDate.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><div class="row"><button aria-label="Previous month" onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);render()">‹</button><button onclick="calDate=new Date();render()">Today</button><button aria-label="Next month" onclick="calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);render()">›</button></div></div><div class="calendar">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(d=>`<div class="weekday">${d}</div>`).join('')}${days.map(d=>{let key=dateKey(d),ev=data.events.filter(e=>e.date===key),ta=data.tasks.filter(t=>t.date===key);return `<button class="day ${key===today?'today':''} ${d.getMonth()!==m?'other':''}" onclick="showDay('${key}')" aria-label="View ${key}"><b>${d.getDate()}</b>${ev.slice(0,2).map(e=>`<span class="eventchip">${esc(e.time)} ${esc(e.title)}</span>`).join('')}${ta.slice(0,1).map(t=>`<span class="eventchip">${t.done?'✓':'○'} ${esc(t.title)}</span>`).join('')}${ev.length+ta.length>3?`<small>+${ev.length+ta.length-3} more</small>`:''}</button>`}).join('')}</div></div>`}
function showDay(d){$('#modalContent').innerHTML=`<div class="dialoghead"><h2>${niceDate(d)}</h2><button class="ghost" onclick="closeModal()" aria-label="Close">✕</button></div>${data.events.filter(e=>e.date===d).map(e=>`<div class="item"><div class="itembody"><b>${esc(e.title)}</b><br><small>${esc(e.time||'All day')} · ${esc(e.location||'')}</small></div><button onclick="edit('events','${esc(e.id)}')">Edit</button></div>`).join('')}${data.tasks.filter(t=>t.date===d).map(taskRow).join('')||''}<div class="formactions"><button class="primary" onclick="edit('events','', '${d}')">＋ Event</button></div>`;openModal()}
function habitTable(list){let days=week();return `<div class="habitrow habitlabels"><span style="text-align:left">THIS WEEK</span>${days.map(d=>`<span>${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'narrow'})}</span>`).join('')}</div>${list.map(h=>`<div class="habitrow"><span>${esc(h.title)}</span>${days.map(d=>`<button class="habitday ${h.days.includes(d)?'on':''}" ${d>today?'disabled':''} aria-label="${esc(h.title)} on ${d}" aria-pressed="${h.days.includes(d)}" onclick="habitTick('${esc(h.id)}','${d}')">${h.days.includes(d)?'✓':'·'}</button>`).join('')}</div>`).join('')||empty('Start small. Add a habit you want to nurture.')}`}
function habitTick(id,d){let h=data.habits.find(h=>h.id===id);h.days=h.days.includes(d)?h.days.filter(v=>v!==d):[...h.days,d];save();render()}function streak(h){let n=0,d=h.days.includes(today)?today:plusDay(-1);while(h.days.includes(d)&&n<10000){n++;d=plusDay(-1,d)}return n}
function habitsView(){return header('Show up for yourself.','A gentle weekly tracker for the routines that help you feel good.',"edit('habits')",'New habit')+`<div class="card">${habitTable(data.habits)}</div><div class="cards" style="margin-top:20px">${data.habits.map(h=>`<div class="card"><div class="cardhead"><h2>${esc(h.title)}</h2><button class="small" onclick="edit('habits','${esc(h.id)}')">Edit</button></div><div class="goalnum">${streak(h)} <small>day streak</small></div><p class="muted">${h.days.length} total check-ins</p></div>`).join('')}</div>`}
function goalsView(){return header('Give your dreams direction.','Set a target. Notice your progress. Celebrate the little milestones.',"edit('goals')",'New goal')+`<div class="cards">${data.goals.map(g=>`<section class="card"><div class="cardhead"><span class="pill">${g.current>=g.target?'ACHIEVED':'IN PROGRESS'}</span><button class="small ghost" onclick="edit('goals','${esc(g.id)}')">Edit ↗</button></div><h2>${esc(g.title)}</h2><p class="muted">${esc(g.description||'One step at a time.')}</p><div class="goalnum">${g.current} <small>/ ${g.target} ${esc(g.unit||'')}</small></div><div class="progress"><span style="width:${Math.min(100,g.current/g.target*100)}%"></span></div><div class="row between" style="margin-top:18px"><small>${g.date?'Aim for '+niceDate(g.date):'At your own pace'}</small><button class="small" onclick="edit('goals','${esc(g.id)}')">Update progress</button></div></section>`).join('')||empty('Your next chapter starts with a goal.')}</div>`}
function moneyView(){let tx=currentTx(),income=tx.filter(t=>t.type==='income').reduce((a,b)=>a+b.amount,0),spent=tx.filter(t=>t.type==='expense').reduce((a,b)=>a+b.amount,0),budget=Number(data.settings.budget)||0;return header('A clearer view of your money.','A simple manual tracker — amounts below cover the current month.',"edit('transactions')",'Add entry')+`<div class="stats"><div class="stat"><small>MONTHLY INCOME</small><div class="num">${cash(income)}</div></div><div class="stat"><small>MONTHLY SPENDING</small><div class="num">${cash(spent)}</div></div><div class="stat"><small>MONTHLY BALANCE</small><div class="num">${cash(income-spent)}</div></div><div class="stat"><small>BUDGET REMAINING</small><div class="num">${cash(budget-spent)}</div></div></div><div class="card" style="margin-bottom:20px"><div class="row between"><span>Monthly spending budget · ${cash(budget)}</span><button class="small" onclick="go('Settings')">Change budget</button></div><div class="progress"><span style="width:${budget?Math.min(100,spent/budget*100):0}%"></span></div><small>${budget?Math.round(spent/budget*100)+'% used':'Set a budget in Settings'}</small></div><div class="card"><div class="cardhead"><h2>All transactions</h2><button class="small" onclick="exportCSV()">Export CSV</button></div>${[...data.transactions].sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<div class="item"><span class="doticon">${t.type==='income'?'↙':'↗'}</span><div class="itembody"><div class="itemtitle">${esc(t.title)}</div><small>${niceDate(t.date)} · ${esc(t.category||'Other')}</small></div><b class="money ${t.type==='income'?'positive':'negative'}">${t.type==='income'?'+':'−'}${cash(t.amount)}</b><button class="small ghost" aria-label="Edit transaction" onclick="edit('transactions','${esc(t.id)}')">✎</button></div>`).join('')||empty('Add your first income or expense. No bank connection required.')}</div>`}
function notesView(){return header('A home for your little ideas.','Thoughts, lists, reflections — keep the things you want to come back to.',"edit('notes')",'New note')+`<div class="cards">${[...data.notes].sort((a,b)=>Number(b.pinned)-Number(a.pinned)).map(n=>`<article class="card note"><div class="cardhead"><small>${n.pinned?'◆ PINNED':esc(n.category||'PERSONAL')}</small><button class="small ghost" onclick="edit('notes','${esc(n.id)}')">Edit ↗</button></div><h2>${esc(n.title)}</h2><p>${esc(n.body)}</p><small>${niceDate(n.date)}</small></article>`).join('')||empty('Capture something worth remembering.')}</div>`}
function safeURL(v){try{let u=new URL(v);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function linksView(){return header('Keep the good finds.','A small collection of useful places, inspiration and things to revisit.',"edit('links')",'Save bookmark')+`<div class="cards">${data.links.map(l=>`<article class="card"><div class="cardhead"><span class="pill">${esc(l.category||'INSPIRATION')}</span><button class="small ghost" onclick="edit('links','${esc(l.id)}')">Edit</button></div><h2>${esc(l.title)}</h2><p class="muted" style="overflow-wrap:anywhere">${esc(l.description||l.url)}</p><a href="${esc(safeURL(l.url))}" target="_blank" rel="noopener noreferrer">Open bookmark ↗</a></article>`).join('')||empty('Save a link you would love to find again.')}</div>`}
function focusView(){return header('One thing at a time.','A quiet timer to help you settle into what matters.')+`<div class="card focuscard"><span class="pill">YOUR FOCUS SPACE</span><h2 style="margin-top:24px;font-size:30px">A little uninterrupted time.</h2><p class="muted">Keep this page open. The timer checks elapsed time when you return.</p><div class="row wrap"><button onclick="setTimer(25)">25 min focus</button><button onclick="setTimer(50)">50 min deep work</button><button onclick="setTimer(5)">5 min break</button></div><div class="timer" id="clock">25:00</div><div class="row"><button class="primary" id="timerToggle" onclick="toggleTimer()">${timerRunning?'Pause':'Start session'}</button><button onclick="resetTimer()">Reset</button></div><p style="margin-top:26px" class="muted">${data.focusSessions} completed sessions</p><small>Timer resets if you reload or close this page.</small></div>`}
let timerLength=25;function setTimer(n){timerLength=n;timerRunning=false;clearInterval(timerId);timerRemaining=n*60;render()}function updateClock(){if($('#clock'))$('#clock').textContent=String(Math.floor(timerRemaining/60)).padStart(2,'0')+':'+String(timerRemaining%60).padStart(2,'0');if($('#timerToggle'))$('#timerToggle').textContent=timerRunning?'Pause':'Start session'}function toggleTimer(){if(timerRunning){timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));timerRunning=false;clearInterval(timerId)}else{if(timerRemaining===0)timerRemaining=timerLength*60;timerRunning=true;timerEnd=Date.now()+timerRemaining*1000;timerId=setInterval(()=>{timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateClock();if(timerRemaining===0){timerRunning=false;clearInterval(timerId);data.focusSessions++;save();toast('Session complete. Take a breath — you earned a pause.');if(page==='Focus')render()}},250)}updateClock()}function resetTimer(){setTimer(timerLength)}
function settingsView(){return header('Make this space yours.','Your preferences, your colors, your pace.')+`<div class="settings-grid"><section class="card"><h2>Personal touches</h2><form onsubmit="saveSettings(event)" style="margin-top:20px"><label>Your name<input name="name" value="${esc(data.settings.name)}" maxlength="30" placeholder="How should we greet you?"></label><label>Currency<select name="currency">${['USD','GBP','EUR','CAD','AUD','PKR','INR'].map(c=>`<option ${c===data.settings.currency?'selected':''}>${c}</option>`).join('')}</select></label><label>Monthly spending budget<input name="budget" type="number" min="0" max="1000000000" step="0.01" value="${data.settings.budget}" required></label><p class="muted" style="font-size:12px">Changing currency changes the label only; it does not convert existing amounts.</p><button class="primary">Save preferences</button></form><h3 style="margin-top:28px">Choose your palette</h3><div class="row">${[['forest','#183f38'],['ocean','#1d3854'],['plum','#785373']].map(([t,c])=>`<button title="${t}" aria-label="${t} theme" class="themebtn ${data.settings.theme===t?'selected':''}" style="background:${c}" onclick="data.settings.theme='${t}';save();render()"></button>`).join('')}<button onclick="toggleDark()">◐ Light / dark</button></div></section><div class="stack"><section class="card"><h2>Your data, in your hands</h2><p class="muted" style="margin-top:16px">Your entries stay in this browser. Back up regularly, especially before changing devices or clearing browser data.</p><div class="row wrap"><button class="primary" onclick="backup()">↓ Export backup</button><button onclick="$('#restoreFile').click()">↑ Restore backup</button></div><p class="muted" style="font-size:12px;margin:14px 0 0">JSON backup · Restore replaces the current planner.</p></section><section class="card"><h2>A fresh beginning</h2><p class="muted" style="margin-top:16px">Explore sample entries or clear the planner when you are ready.</p><div class="row wrap"><button onclick="loadDemo()">Load sample planner</button><button class="danger" onclick="resetData()">Clear all data</button></div></section></div><section class="card help full"><h2>A few helpful things</h2><p>This self-contained HTML planner has no subscriptions, external fonts or online dependencies. On desktop, download the HTML file and open it in a current browser. Keep the same file and browser to retain your entries.</p><ul><li>Mobile layout is responsive. Some mobile file viewers do not execute HTML or retain local data; open in a full browser. Desktop is recommended for downloaded use.</li><li>No cloud sync, bank sync, push notifications, document scanning or app-store installation is included.</li><li>Recurring tasks create their next dated copy when you complete them.</li><li>Use Print page for a paper copy or your browser's Save as PDF option.</li><li>Local storage is not encrypted. Do not use it as a password or sensitive-document vault.</li></ul><button onclick="downloadPlanner()">↓ Download clean HTML planner</button></section></div>`}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);data.settings.name=String(f.get('name')).trim();data.settings.currency=f.get('currency');data.settings.budget=Number(f.get('budget'));save();render();toast('Your space, updated.')}
function field(label,name,value='',type='text',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${esc(value)}" ${extra}></label>`}function selectField(label,name,options,value){return `<label>${label}<select name="${name}">${options.map(x=>`<option value="${esc(x)}" ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function openModal(){if(!$('#modal').open)$('#modal').showModal()}function closeModal(){$('#modal').close()}
function edit(type,id='',date=today){let x=id?data[type].find(x=>x.id===id):{};if(!x)return;const names={tasks:'task',events:'event',habits:'habit',goals:'goal',transactions:'entry',notes:'note',links:'bookmark'};let form=field('Title','title',x.title||'','text','required maxlength="150"');if(type==='tasks')form+=`<div class="formgrid">${field('Due date','date',x.date||date,'date')}${selectField('Priority','priority',['low','medium','high'],x.priority||'medium')}${field('Category','category',x.category||'Personal','text','maxlength="40"')}${selectField('Repeat after completion','repeat',['none','daily','weekly'],x.repeat||'none')}</div>`;if(type==='events')form+=`<div class="formgrid">${field('Date','date',x.date||date,'date','required')}${field('Time (optional)','time',x.time||'','time')}</div>${field('Location / meeting link','location',x.location||'','text','maxlength="300"')}`;if(type==='goals')form+=`<div class="formgrid">${field('Current progress','current',x.current??0,'number','min="0" max="1000000000" step="any" required')}${field('Target','target',x.target||10,'number','min="0.01" max="1000000000" step="any" required')}${field('Unit (pages, hours, etc.)','unit',x.unit||'','text','maxlength="30"')}${field('Target date','date',x.date||'','date')}</div>${field('Why it matters','description',x.description||'','text','maxlength="300"')}`;if(type==='transactions')form+=`<div class="formgrid">${field('Amount','amount',x.amount||'','number','min="0.01" max="1000000000" step="0.01" required')}${selectField('Type','type',['expense','income'],x.type||'expense')}${field('Date','date',x.date||date,'date','required')}${field('Category','category',x.category||'Other','text','maxlength="40"')}</div>`;if(type==='notes')form+=`${field('Category','category',x.category||'Personal','text','maxlength="40"')}<label>Your note<textarea name="body" rows="7" maxlength="20000">${esc(x.body||'')}</textarea></label><label class="row"><input style="width:auto;margin:0" type="checkbox" name="pinned" ${x.pinned?'checked':''}> Pin this note</label>`;if(type==='links')form+=`${field('Website URL','url',x.url||'','url','required placeholder="https://example.com"')}${field('Collection','category',x.category||'Inspiration','text','maxlength="40"')}${field('A little description','description',x.description||'','text','maxlength="300"')}`;if(type==='habits')form+='<p class="muted">A daily habit, tracked one check-in at a time. You can mark today and earlier days in the current week.</p>';$('#modalContent').innerHTML=`<div class="dialoghead"><h2>${id?'Edit':'New'} ${names[type]}</h2><button class="ghost" onclick="closeModal()" aria-label="Close">✕</button></div><form id="entryForm">${form}<div class="formactions">${id?`<button type="button" class="danger" onclick="removeEntry('${type}','${esc(id)}')">Delete</button>`:''}<button type="button" onclick="closeModal()">Cancel</button><button class="primary" type="submit">Save ${names[type]}</button></div></form>`;$('#entryForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());o.title=o.title.trim();if(!o.title){toast('Please enter a title.');return}if(type==='links'&&!safeURL(o.url)){toast('Use a full http:// or https:// website address.');return}if(type==='goals'){o.current=Number(o.current);o.target=Number(o.target)}if(type==='transactions')o.amount=Number(o.amount);if(type==='tasks'){o.done=x.done||false;if(x.parentId)o.parentId=x.parentId;}if(type==='habits')o.days=x.days||[];if(type==='notes'){o.pinned=f.has('pinned');o.date=today}o.id=id||uid();if(id)data[type]=data[type].map(a=>a.id===id?o:a);else data[type].push(o);save();closeModal();render();toast('Saved. A little more organized.')};openModal()}
function removeEntry(type,id){if(!confirm('Delete this entry? This cannot be undone.'))return;data[type]=data[type].filter(x=>x.id!==id);save();closeModal();render()}
function download(blob,name){let u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}function backup(){download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'Daylume-Backup-'+today+'.json');toast('Backup exported. Keep it somewhere safe.')}
$('#restoreFile').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{if(file.size>10000000)throw Error('Too large');let d=validate(JSON.parse(await file.text()));if(confirm('Replace all current entries with this backup? Export a backup first if needed.')){data=d;save();render();toast('Your planner has been restored.')}}catch(e){toast('Could not restore: use a valid Daylume JSON backup under 10 MB.')}finally{$('#restoreFile').value=''}};
function exportCSV(){let rows=[['Date','Title','Type','Category','Amount','Currency'],...data.transactions.map(t=>[t.date,t.title,t.type,t.category,t.amount,data.settings.currency])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n');download(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}),'Daylume-Transactions.csv')}
function resetData(){if(confirm('Clear every entry and preference? Export a backup first.')){data=fresh();save();go('Overview');toast('A fresh page is ready.')}}
function loadDemo(){if(data.tasks.length+data.events.length+data.habits.length+data.goals.length+data.notes.length+data.links.length+data.transactions.length>0&&!confirm('Sample planner will replace all current entries. Continue?'))return;let settings=data.settings;data=fresh();data.settings=settings;data.tasks=[{id:uid(),title:'Plan a slower, brighter week',date:today,priority:'high',category:'Personal',repeat:'none',done:false},{id:uid(),title:'Take a screen-free afternoon walk',date:today,priority:'medium',category:'Wellbeing',repeat:'daily',done:false},{id:uid(),title:'Outline the next creative project',date:today,priority:'low',category:'Creative',repeat:'none',done:false},{id:uid(),title:'Make room for a morning ritual',date:today,priority:'low',category:'Wellbeing',repeat:'none',done:true}];data.events=[{id:uid(),title:'Coffee & a good conversation',date:plusDay(1),time:'10:30',location:'Favorite café'},{id:uid(),title:'Weekly reset',date:plusDay(2),time:'17:00',location:'At home'}];data.habits=['Read a few pages','Move a little','A moment of gratitude'].map((t,i)=>({id:uid(),title:t,days:week().filter(d=>d<=today).filter((d,j)=>(j+i)%3!==0)}));data.goals=[{id:uid(),title:'Build a reading rhythm',current:7,target:12,unit:'books',date:plusDay(70),description:'More stories, more perspectives.'},{id:uid(),title:'A little adventure fund',current:350,target:1000,unit:'saved',date:plusDay(90),description:'Make the next getaway possible.'}];data.notes=[{id:uid(),title:'The little things list',body:'Fresh flowers on the table.\nA walk without a destination.\nFinishing something I started.\n\nMore of this, please.',category:'Inspiration',pinned:true,date:today}];data.transactions=[{id:uid(),title:'Monthly income · sample',type:'income',amount:2400,date:today,category:'Income'},{id:uid(),title:'Groceries · sample',type:'expense',amount:86.5,date:today,category:'Food'}];save();render();toast('Sample entries loaded — clear them in Settings whenever you like.')}
function renderSearch(){let found=[];for(let type of ['tasks','events','habits','goals','notes','links','transactions'])for(let x of data[type])if([x.title,x.body,x.category,x.description].join(' ').toLowerCase().includes(searchText))found.push({type,x});$('#content').innerHTML=header('Find your little things.',`${found.length} matching entries`)+`<div class="card">${found.map(({type,x})=>`<div class="item"><span class="pill">${type}</span><div class="itembody">${esc(x.title)}</div><button class="small" onclick="edit('${type}','${esc(x.id)}')">Open ↗</button></div>`).join('')||empty('No matches. Try another word.')}</div>`}
$('#search').oninput=e=>{searchText=e.target.value.toLowerCase().trim();render()};$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});
function downloadPlanner(){let clone=document.documentElement.cloneNode(true);clone.querySelector('#content').innerHTML='';clone.querySelector('#nav').innerHTML='';clone.querySelector('#modalContent').innerHTML='';clone.querySelector('#modal').removeAttribute('open');clone.querySelector('#toast').hidden=true;clone.querySelector('#search').value='';clone.querySelector('#sidebar').classList.remove('open');download(new Blob(['<!DOCTYPE html>\n'+clone.outerHTML],{type:'text/html'}),'Daylume-Planner.html');toast('Clean app downloaded. Personal entries are not included.')}
render();if(!storageOK)toast('Local data could not be loaded. Export a backup after making changes.');
</script></body></html>
