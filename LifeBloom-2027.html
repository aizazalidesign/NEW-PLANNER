<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7fc">
<title>LifeBloom 2027 — Interactive Life Planner</title>
<style>
:root{--navy:#20234f;--purple:#6556cf;--violet:#8d79e8;--pink:#f5dce9;--mint:#dff4ec;--blue:#e3edff;--peach:#ffeadc;--ink:#292b43;--muted:#777991;--line:#e9e8f1;--paper:#fff;--bg:#f7f7fc;--shadow:0 12px 35px #35305e0d;--radius:20px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #b8aafc;outline-offset:2px}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:248px;background:#24264f;color:white;padding:25px 17px;display:flex;flex-direction:column;z-index:5;overflow:auto}.brand{padding:5px 10px 24px}.brand-mark{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#a99bf8,#e7b7d5);color:#28254f;font-size:22px;margin-right:9px;vertical-align:middle}.brand strong{font:700 20px Georgia,serif;letter-spacing:-.4px}.brand small{display:block;margin:7px 0 0 48px;color:#c5c6df;letter-spacing:2px;font-size:9px}.nav-label{color:#aeb0d0;text-transform:uppercase;letter-spacing:1.6px;font-size:9px;padding:14px 12px 7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#d9d9eb;text-align:left;padding:10px 12px;border-radius:11px;display:flex;gap:12px;align-items:center}.nav button:hover,.nav button.active{background:#414374;color:white}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto;padding:18px 10px 4px;color:#bfc0d9;font-size:11px;border-top:1px solid #45466c}.side-bottom strong{color:white}
.main{margin-left:248px;padding:25px 34px 60px;max-width:1700px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:23px}.crumb{color:var(--muted);font-size:12px}.top-actions{display:flex;gap:8px;align-items:center}.icon-btn,.soft-btn{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 12px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e9e3ff;color:#5142b6;font-weight:700}.mobile-menu{display:none}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:15px;margin:8px 0 20px}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--purple);font-weight:800;text-transform:uppercase}.page-head h1{font:400 clamp(28px,3.4vw,39px)/1.1 Georgia,serif;color:var(--navy);margin:6px 0}.sub{color:var(--muted);margin:5px 0 0}.primary{border:0;background:linear-gradient(110deg,#6556cf,#8876e6);color:white;padding:11px 16px;border-radius:12px;font-weight:700;box-shadow:0 5px 14px #6556cf28}.primary:hover{filter:brightness(1.05)}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:var(--shadow);min-width:0}.card h2{font:400 19px Georgia,serif;color:var(--navy);margin:0 0 13px}.card h3{font-size:13px;margin:0 0 7px}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}.hero{background:linear-gradient(115deg,#eeebff 0%,#fff5fa 60%,#effaf6 100%);border:1px solid #e7e1fa;border-radius:23px;padding:23px 25px;display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:16px;overflow:hidden}.hero h2{font:400 clamp(23px,3vw,32px) Georgia,serif;color:#252653;margin:5px 0}.hero p{color:#686984;margin:0;max-width:620px}.hero-art{font-size:70px;opacity:.9}.metric{display:flex;align-items:center;gap:12px}.metric-ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px}.metric strong{display:block;font:26px Georgia,serif;color:var(--navy)}.metric small{color:var(--muted)}.progress{height:7px;border-radius:9px;background:#eeedf5;overflow:hidden;margin-top:10px}.progress span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#6b5bd4,#b29be9)}.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f0eff5}.row:last-child{border:0}.row-main{flex:1;min-width:0}.row-main strong{display:block;font-size:13px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#f0edff;color:#5a4bb9;font-size:10px;font-weight:700}.check{width:17px;height:17px;accent-color:var(--purple)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:13px}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:11px;color:#676982;font-weight:700}.field input,.field select,.field textarea,input.control,select.control,textarea.control{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px;min-width:0}.field textarea,textarea.control{min-height:90px;resize:vertical}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}.span-all{grid-column:1/-1}.btn{border:1px solid var(--line);background:white;padding:8px 11px;border-radius:10px;font-size:12px}.btn:hover{border-color:#b8acef}.btn.danger{color:#c44b65}.empty{padding:28px 10px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--navy);font:18px Georgia,serif;margin-bottom:5px}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:10px;padding:7px}.calday{min-height:88px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:7px;cursor:pointer}.calday:hover{border-color:#a99cf0}.calday.today{border:2px solid var(--purple)}.calday.dim{opacity:.4}.calday .num{font-size:11px;font-weight:800}.cal-event{font-size:9px;background:#eeeaff;color:#5546b5;padding:3px 4px;border-radius:5px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.week-col{background:#fafaff;border:1px solid var(--line);border-radius:12px;padding:8px;min-height:150px}.week-col strong{font-size:11px}.week-col .muted{font-size:10px}.vision-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.vision-tile{min-height:160px;border-radius:15px;padding:13px;background:linear-gradient(145deg,#f2edff,#fff2f7);position:relative;overflow:hidden}.vision-tile img{width:100%;height:95px;object-fit:cover;border-radius:9px;margin-bottom:8px}.vision-tile strong{font:16px Georgia,serif}.vision-tile p{font-size:11px;color:var(--muted);margin:5px 0}.barline{height:9px;background:#f0eff5;border-radius:8px;overflow:hidden}.barline span{height:100%;display:block;background:#8a7ae3;border-radius:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #efedf4;white-space:nowrap}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.8px}.mood{display:flex;gap:8px;flex-wrap:wrap}.mood button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:22px}.mood button.selected{border:2px solid var(--purple);background:#f4f1ff}
.toast{position:fixed;right:22px;bottom:22px;background:#26274f;color:white;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);display:none;z-index:20}.modal-back{position:fixed;inset:0;background:#17183280;display:none;place-items:center;padding:15px;z-index:15}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:22px;box-shadow:0 25px 80px #15142c40}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.modal-head h2{font:22px Georgia,serif;margin:0;color:var(--navy)}.modal-close{border:0;background:#f2f1f7;border-radius:10px;padding:7px 10px}
body.dark{--bg:#17182d;--paper:#22243d;--ink:#f1f0fa;--muted:#b5b4ca;--line:#393b58;--navy:#eeecff;color:var(--ink)}body.dark .main,body.dark{color:var(--ink)}body.dark .card,body.dark .icon-btn,body.dark .soft-btn,body.dark .btn,body.dark .field input,body.dark .field select,body.dark .field textarea,body.dark .control,body.dark .calday,body.dark .mood button{background:#22243d;color:#f1f0fa;border-color:#393b58}body.dark .hero{background:linear-gradient(115deg,#302d50,#3a2c43)}body.dark .hero h2{color:#fff}body.dark .hero p{color:#d4d1e8}body.dark .card h2,body.dark .metric strong{color:#eeecff}body.dark .week-col{background:#20213a;border-color:#393b58}body.dark .modal{background:#22243d;color:#f1f0fa}body.dark .modal-head h2{color:#fff}body.dark .progress,body.dark .barline{background:#3a3b58}
@media(max-width:1100px){.sidebar{width:220px}.main{margin-left:220px;padding:22px}.s3{grid-column:span 6}.s4,.s5,.s7,.s8{grid-column:span 6}}
@media(max-width:760px){.sidebar{transform:translateX(-105%);transition:.2s;width:270px;box-shadow:15px 0 40px #17183240}.sidebar.open{transform:none}.main{margin:0;padding:15px 13px 80px}.mobile-menu{display:inline-block}.topbar{margin-bottom:15px}.page-head{align-items:flex-start;flex-direction:column}.page-head .primary{width:100%}.hero{padding:18px}.hero-art{font-size:44px}.s3,.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.grid{gap:11px}.card{padding:15px}.vision-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.week-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.calday{min-height:64px;padding:4px}.cal-event{display:none}.brand{padding-bottom:10px}.top-actions .soft-btn{display:none}}
@media print{.sidebar,.topbar,.primary,.toolbar,.btn,.icon-btn,.mobile-menu{display:none!important}.main{margin:0;padding:0}.card{box-shadow:none;break-inside:avoid}.hero{print-color-adjust:exact}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><span class="brand-mark">✦</span><strong>LifeBloom 2027</strong><small>PLAN WITH PURPOSE</small></div>
 <div class="nav-label">Your overview</div><nav class="nav" id="nav">
 <button data-page="Dashboard" class="active"><span class="ico">⌂</span>Dashboard</button>
 <button data-page="Goals"><span class="ico">◎</span>Goals & milestones</button>
 <button data-page="Vision Board"><span class="ico">✧</span>Vision board</button>
 <button data-page="Planner"><span class="ico">▦</span>Daily & weekly planner</button>
 <button data-page="Calendar"><span class="ico">▣</span>Calendar</button>
 <button data-page="Habits"><span class="ico">↗</span>Habits & routines</button>
 <div class="nav-label">Life areas</div>
 <button data-page="Finances"><span class="ico">$</span>Finances & savings</button>
 <button data-page="Wellness"><span class="ico">♡</span>Wellness & self-care</button>
 <button data-page="Journal"><span class="ico">▤</span>Journal & gratitude</button>
 <button data-page="Travel"><span class="ico">✈</span>Travel planner</button>
 <button data-page="Learning"><span class="ico">▱</span>Learning hub</button>
 <button data-page="Notes"><span class="ico">✎</span>Notes & lists</button>
 <div class="nav-label">Personalize</div>
 <button data-page="Settings"><span class="ico">⚙</span>Settings & backup</button>
 </nav>
 <div class="side-bottom"><strong>Small steps. Big meaning.</strong><br>Everything you want to grow, in one place.</div>
</aside>
<main class="main">
 <header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-menu" id="menuBtn">☰</button><div class="crumb">MY SPACE / <b id="crumb">DASHBOARD</b></div></div><div class="top-actions"><span class="muted" id="todayLabel"></span><button class="soft-btn" id="themeBtn">◐ Theme</button><button class="soft-btn" onclick="window.print()">Print</button><div class="avatar">L</div></div></header>
 <section id="view"></section>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add item</h2><button class="modal-close" id="modalClose">✕</button></div><div id="modalBody"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const KEY='lifebloom-2027-v1';
const blank=()=>({version:1,settings:{name:'LifeBloom 2027',currency:'USD',theme:'light',year:2027},goals:[],events:[],habits:[],transactions:[],bills:[],savings:[],wellness:[],journal:[],trips:[],courses:[],notes:[],vision:[]});
let data=blank(),page='Dashboard',calMonth='2027-01',plannerDate=today(),editing=null;
try{const saved=localStorage.getItem(KEY);if(saved){const parsed=JSON.parse(saved);if(parsed.version===1)data={...blank(),...parsed};}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast('Storage is full. Export a backup and remove large images.');}}
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2600)}
function money(n){return new Intl.NumberFormat(undefined,{style:'currency',currency:data.settings.currency||'USD',maximumFractionDigits:0}).format(Number(n)||0)}
function dateFmt(d){if(!d)return 'No date';return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function nav(p){page=p;$('#sidebar').classList.remove('open');render()}
function head(title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">PLAN · TRACK · ORGANIZE · GROW</div><h1>${title}</h1><p class="sub">${desc}</p></div>${action}</div>`}
function metric(icon,label,value,detail,color){return `<div class="card s3"><div class="metric"><div class="metric-ico" style="background:${color}">${icon}</div><div><small>${label}</small><strong>${value}</strong><small>${detail}</small></div></div></div>`}
function addBtn(label,fn){return `<button class="primary" onclick="${fn}">＋ ${label}</button>`}
function empty(msg){return `<div class="empty"><b>Your space is ready</b>${msg}</div>`}
function listRows(items,type){if(!items.length)return empty('Add your first item to get started.');return items.map(x=>`<div class="row"><div class="row-main"><strong>${esc(x.title||x.name||'Untitled')}</strong><span class="muted">${esc(x.date?dateFmt(x.date):x.category||x.detail||'')}</span></div><span class="pill">${esc(x.status||x.category||type)}</span><button class="btn" onclick="editItem('${type}','${x.id}')">Edit</button><button class="btn danger" onclick="removeItem('${type}','${x.id}')">×</button></div>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dashboard(){
const done=data.events.filter(x=>x.done).length,goalPct=data.goals.length?Math.round(data.goals.reduce((a,x)=>a+(+x.progress||0),0)/data.goals.length):0;
const income=data.transactions.filter(x=>x.kind==='Income').reduce((a,x)=>a+(+x.amount||0),0),spent=data.transactions.filter(x=>x.kind==='Expense').reduce((a,x)=>a+(+x.amount||0),0);
const todayEvents=data.events.filter(x=>x.date===today());
return head('Good morning, bright mind ✨','A little intention today can create a meaningful year.')+
`<div class="hero"><div><div class="eyebrow">YOUR 2027, YOUR WAY</div><h2>Make room for what matters.</h2><p>Bring your goals, routines, calendar, finances and personal growth into one calm, beautiful planning space.</p><div style="margin-top:15px">${addBtn('Add a priority',"openAdd('event')")}</div></div><div class="hero-art">🌷 ✨</div></div>
<div class="grid">
${metric('◎','Active goals',data.goals.length,goalPct+'% average progress','#e8e3ff')}
${metric('✓','Today’s plans',todayEvents.length,done+' completed','#def4eb')}
${metric('$','Income recorded',money(income),'All recorded income','#ffeadc')}
${metric('♡','Habits to grow',data.habits.length,'Your consistency journey','#f9e3ef')}
<div class="card s7"><h2>Today’s focus</h2><div class="toolbar"><span class="muted">${dateFmt(today())}</span><span class="pill">One step at a time</span></div>${todayEvents.length?todayEvents.slice(0,5).map(e=>`<div class="row"><input class="check" type="checkbox" ${e.done?'checked':''} onchange="toggleEvent('${e.id}',this.checked)"><div class="row-main"><strong style="${e.done?'text-decoration:line-through;opacity:.55':''}">${esc(e.title)}</strong><span class="muted">${esc(e.time||'Any time')} · ${esc(e.category||'Personal')}</span></div></div>`).join(''):empty('Your day is open. Add a priority, appointment or task.')}</div>
<div class="card s5"><h2>Life areas snapshot</h2>${[['Goals',data.goals.length,'#8a79e4'],['Habits',data.habits.length,'#e58ab5'],['Journal entries',data.journal.length,'#70bda1'],['Trips planned',data.trips.length,'#e7a36f']].map(a=>`<div style="margin:14px 0"><div class="row" style="padding:0;border:0"><span class="row-main"><strong>${a[0]}</strong></span><b>${a[1]}</b></div><div class="barline"><span style="width:${Math.min(100,a[1]*12)}%;background:${a[2]}"></span></div></div>`).join('')}</div>
<div class="card s6"><h2>Recent goals</h2>${data.goals.length?data.goals.slice(0,4).map(g=>`<div style="margin:13px 0"><div class="row" style="padding:0;border:0"><span class="row-main"><strong>${esc(g.title)}</strong><small class="muted">${esc(g.category||'Personal')}</small></span><b>${+g.progress||0}%</b></div><div class="progress"><span style="width:${pct(+g.progress||0,100)}%"></span></div></div>`).join(''):empty('Add a goal to see your progress here.')}</div>
<div class="card s6"><h2>Money overview</h2><div class="grid"><div class="s6"><small class="muted">Income</small><h2 style="margin:4px 0">${money(income)}</h2></div><div class="s6"><small class="muted">Expenses</small><h2 style="margin:4px 0">${money(spent)}</h2></div></div><div class="progress"><span style="width:${pct(spent,Math.max(1,income))}%;background:#e49ab8"></span></div><p class="muted">Balance: <b>${money(income-spent)}</b> · Add transactions in Finances.</p></div></div>`
}
function goals(){return head('Goals & milestones','Turn your big ideas into smaller, achievable steps.',addBtn('New goal',"openAdd('goal')"))+`<div class="grid">${data.goals.length?data.goals.map(g=>`<div class="card s4"><div class="row" style="padding-top:0"><span class="row-main"><h2>${esc(g.title)}</h2><small class="muted">${esc(g.category||'Personal')} · ${dateFmt(g.date)}</small></span><button class="btn" onclick="editItem('goal','${g.id}')">Edit</button></div><p class="muted">${esc(g.why||'A goal worth growing toward.')}</p><div class="row"><b>${+g.progress||0}%</b><span class="muted">complete</span></div><div class="progress"><span style="width:${pct(+g.progress||0,100)}%"></span></div><p class="muted">Next step: ${esc(g.next||'Add your next action')}</p><button class="btn danger" onclick="removeItem('goal','${g.id}')">Delete goal</button></div>`).join(''): `<div class="card s12">${empty('Create goals for health, career, relationships, finances, creativity and more.')}</div>`}</div>`}
function vision(){return head('Your vision board','Collect images, affirmations and reminders of the life you are building.',addBtn('Add vision tile',"openAdd('vision')"))+`<div class="card"><div class="vision-grid">${data.vision.length?data.vision.map(v=>`<div class="vision-tile">${v.image?`<img src="${v.image}" alt="">`:'<div style="font-size:36px;margin:12px">✧</div>'}<strong>${esc(v.title)}</strong><p>${esc(v.note||'')}</p><button class="btn danger" onclick="removeItem('vision','${v.id}')">Remove</button></div>`).join(''):empty('Add your dream destinations, affirmations, images and future-self reminders.')}</div></div>`}
function planner(){const date=plannerDate,items=data.events.filter(e=>e.date===date);return head('Daily & weekly planner','Give your time a thoughtful shape, one day at a time.',addBtn('Add plan',"openAdd('event')"))+`<div class="card"><div class="toolbar"><button class="btn" onclick="shiftPlanner(-1)">← Previous</button><input class="control" style="max-width:180px" type="date" value="${date}" onchange="plannerDate=this.value;render()"><button class="btn" onclick="shiftPlanner(1)">Next →</button><button class="btn" onclick="plannerDate=today();render()">Today</button></div><h2>${dateFmt(date)}</h2>${items.length?items.map(e=>`<div class="row"><input type="checkbox" class="check" ${e.done?'checked':''} onchange="toggleEvent('${e.id}',this.checked)"><div class="row-main"><strong>${esc(e.title)}</strong><span class="muted">${esc(e.time||'Flexible time')} · ${esc(e.category||'Personal')} ${e.notes?'· '+esc(e.notes):''}</span></div><button class="btn" onclick="editItem('event','${e.id}')">Edit</button></div>`).join(''):empty('No plans yet. Add a task, appointment, focus block or personal priority.')}</div><div class="card" style="margin-top:15px"><h2>Next 7 days</h2><div class="week-grid">${Array.from({length:7},(_,i)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+i);const key=d.toISOString().slice(0,10),ev=data.events.filter(e=>e.date===key);return `<div class="week-col"><strong>${d.toLocaleDateString(undefined,{weekday:'short'})}</strong><div class="muted">${dateFmt(key)}</div>${ev.map(e=>`<div class="cal-event">${esc(e.title)}</div>`).join('')||'<small class="muted">Open</small>'}</div>`}).join('')}</div></div>`}
function calendar(){const [y,m]=calMonth.split('-').map(Number),first=new Date(y,m-1,1),start=(first.getDay()+6)%7,days=new Date(y,m,0).getDate();let cells='';for(let i=0;i<42;i++){let n=i-start+1,d=new Date(y,m-1,n),key=d.toISOString().slice(0,10),valid=n>0&&n<=days,ev=data.events.filter(e=>e.date===key);cells+=`<div class="calday ${valid?'':'dim'} ${key===today()?'today':''}" onclick="${valid?`plannerDate='${key}';nav('Planner')`:''}"><div class="num">${valid?n:''}</div>${ev.slice(0,2).map(e=>`<div class="cal-event">${esc(e.title)}</div>`).join('')}</div>`}return head('Your calendar','See important dates, appointments and plans at a glance.',addBtn('Add event',"openAdd('event')"))+`<div class="card"><div class="toolbar"><button class="btn" onclick="moveMonth(-1)">←</button><h2 style="margin:0">${first.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="btn" onclick="moveMonth(1)">→</button><button class="btn" onclick="calMonth='2027-01';render()">2027</button></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div></div>`}
function habits(){return head('Habits & routines','Make consistency visible and celebrate small wins.',addBtn('Add habit',"openAdd('habit')"))+`<div class="grid">${data.habits.length?data.habits.map(h=>{let count=(h.checks||[]).length;return `<div class="card s4"><div class="row" style="border:0;padding-top:0"><span class="row-main"><h2>${esc(h.title)}</h2><small class="muted">${esc(h.frequency||'Daily')} · ${esc(h.category||'Personal')}</small></span><button class="btn" onclick="editItem('habit','${h.id}')">Edit</button></div><div class="metric"><div class="metric-ico" style="background:#e5f5ed">✓</div><div><strong>${count}</strong><small>check-ins recorded</small></div></div><div class="toolbar" style="margin-top:14px"><button class="primary" onclick="checkHabit('${h.id}')">${(h.checks||[]).includes(today())?'✓ Done today':'＋ Check in today'}</button><button class="btn danger" onclick="removeItem('habit','${h.id}')">Delete</button></div></div>`}).join(''):`<div class="card s12">${empty('Add reading, movement, hydration, learning or any routine you want to nurture.')}</div>`}</div>`}
function finances(){const inc=data.transactions.filter(t=>t.kind==='Income').reduce((a,t)=>a+(+t.amount||0),0),out=data.transactions.filter(t=>t.kind==='Expense').reduce((a,t)=>a+(+t.amount||0),0);return head('Finances & savings','Keep income, spending, bills and savings intentions together.',addBtn('Add transaction',"openAdd('transaction')"))+`<div class="grid">${metric('$','Income',money(inc),'Recorded transactions','#def4eb')}${metric('↘','Expenses',money(out),'Recorded transactions','#ffe9df')}${metric('＝','Balance',money(inc-out),'Income minus expenses','#e8e3ff')}${metric('◷','Bills',data.bills.length,'Payments to remember','#f9e3ef')}<div class="card s8"><h2>Transactions</h2><div class="toolbar"><button class="btn" onclick="openAdd('transaction')">＋ Income / expense</button></div>${data.transactions.length?`<div class="table-wrap"><table><thead><tr><th>Item</th><th>Type</th><th>Date</th><th>Amount</th><th></th></tr></thead><tbody>${data.transactions.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(t.kind)}</td><td>${dateFmt(t.date)}</td><td>${money(t.amount)}</td><td><button class="btn danger" onclick="removeItem('transaction','${t.id}')">×</button></td></tr>`).join('')}</tbody></table></div>`:empty('Record your first income or expense.')}</div><div class="card s4"><h2>Bills & savings goals</h2><button class="btn" onclick="openAdd('bill')">＋ Add bill</button> <button class="btn" onclick="openAdd('saving')">＋ Savings goal</button><h3 style="margin-top:15px">Upcoming bills</h3>${listRows(data.bills,'bill')}<h3 style="margin-top:15px">Savings goals</h3>${data.savings.length?data.savings.map(s=>`<div class="row"><div class="row-main"><strong>${esc(s.title)}</strong><small class="muted">${money(s.saved)} / ${money(s.target)}</small><div class="progress"><span style="width:${pct(s.saved,s.target)}%"></span></div></div><button class="btn" onclick="editItem('saving','${s.id}')">Edit</button></div>`).join(''):empty('Create a savings target.')}</div></div>`}
function wellness(){return head('Wellness & self-care','Notice how you feel and make space for care.',addBtn('Log today',"openAdd('wellness')"))+`<div class="grid"><div class="card s6"><h2>Daily check-in</h2>${data.wellness.length?listRows(data.wellness.slice().reverse(),'wellness'):empty('Track mood, sleep, water, movement and a note about your day.')}</div><div class="card s6"><h2>Gentle reminders</h2><div class="row"><span class="metric-ico" style="background:#e4f5ee">💧</span><div class="row-main"><strong>Hydrate</strong><small class="muted">Keep water within reach.</small></div></div><div class="row"><span class="metric-ico" style="background:#f9e4ef">♡</span><div class="row-main"><strong>Pause and breathe</strong><small class="muted">A few quiet minutes count.</small></div></div><div class="row"><span class="metric-ico" style="background:#eeeaff">☀</span><div class="row-main"><strong>Move gently</strong><small class="muted">Choose movement that feels good.</small></div></div><p class="muted">This is a personal reflection tracker, not medical advice.</p></div></div>`}
function journal(){return head('Journal & gratitude','Capture the moments, thoughts and lessons that matter.',addBtn('New entry',"openAdd('journal')"))+`<div class="grid"><div class="card s8"><h2>Your reflections</h2>${data.journal.length?data.journal.slice().reverse().map(j=>`<div class="row"><div class="row-main"><strong>${esc(j.title)}</strong><small class="muted">${dateFmt(j.date)} · ${esc(j.kind||'Reflection')}</small><p class="muted">${esc(j.body||'')}</p></div><button class="btn" onclick="editItem('journal','${j.id}')">Edit</button><button class="btn danger" onclick="removeItem('journal','${j.id}')">×</button></div>`).join(''):empty('Start a gratitude list, morning intention or evening reflection.')}</div><div class="card s4"><h2>Writing prompts</h2>${['Three things I appreciate today…','One thing I learned…','What would make tomorrow feel lighter?','A moment I want to remember…','Something I am proud of…'].map(p=>`<div class="row"><span class="row-main">${p}</span><button class="btn" onclick="openAdd('journal','${p}')">Use</button></div>`).join('')}</div></div>`}
function travel(){return head('Travel planner','Dream, prepare and keep trip details in one place.',addBtn('Add trip',"openAdd('trip')"))+`<div class="grid">${data.trips.length?data.trips.map(t=>`<div class="card s6"><h2>✈ ${esc(t.title)}</h2><p class="muted">${esc(t.destination||'Destination to decide')} · ${dateFmt(t.start)} – ${dateFmt(t.end)}</p><p>${esc(t.notes||'Add itinerary notes and travel details.')}</p><h3>Packing checklist</h3>${(t.packing||'').split('\\n').filter(Boolean).map(p=>`<div class="muted">□ ${esc(p)}</div>`).join('')}<div class="toolbar" style="margin-top:12px"><button class="btn" onclick="editItem('trip','${t.id}')">Edit trip</button><button class="btn danger" onclick="removeItem('trip','${t.id}')">Delete</button></div></div>`).join(''):`<div class="card s12">${empty('Add a destination, dates, itinerary, budget notes and packing checklist.')}</div>`}</div>`}
function learning(){return head('Learning hub','Keep courses, books, skills and study intentions moving.',addBtn('Add learning goal',"openAdd('course')"))+`<div class="card">${data.courses.length?listRows(data.courses,'course'):empty('Track a course, book, skill, class or study project.')}</div>`}
function notes(){return head('Notes & lists','A flexible home for ideas, checklists and useful details.',addBtn('New note',"openAdd('note')"))+`<div class="grid">${data.notes.length?data.notes.map(n=>`<div class="card s4"><h2>${esc(n.title)}</h2><p>${esc(n.body||'')}</p><small class="muted">${dateFmt(n.date)}</small><div class="toolbar" style="margin-top:12px"><button class="btn" onclick="editItem('note','${n.id}')">Edit</button><button class="btn danger" onclick="removeItem('note','${n.id}')">Delete</button></div></div>`).join(''):`<div class="card s12">${empty('Capture an idea, create a list or save a helpful reminder.')}</div>`}</div>`}
function settings(){return head('Settings & backup','Make this planning space feel like yours.')+`<div class="grid"><div class="card s6"><h2>Personal preferences</h2><div class="field"><label>Planner name</label><input id="setName" value="${esc(data.settings.name)}"></div><div class="field"><label>Currency</label><select id="setCurrency">${['USD','GBP','EUR','CAD','AUD','PKR','INR','AED'].map(c=>`<option ${data.settings.currency===c?'selected':''}>${c}</option>`).join('')}</select></div><button class="primary" onclick="saveSettings()">Save preferences</button></div><div class="card s6"><h2>Your data belongs to you</h2><p class="muted">Your entries are saved in this browser on this device. Export a backup before clearing browser data or moving devices.</p><div class="toolbar"><button class="btn" onclick="exportData()">↓ Export backup</button><label class="btn">↑ Import backup<input type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></label></div><button class="btn danger" onclick="clearData()">Reset all planner data</button></div><div class="card s12"><h2>About LifeBloom</h2><p class="muted">An original, browser-based personal planning workspace. This planner is not affiliated with any other planner brand. Use the backup tools regularly. Vision board images are stored in this browser; large images can use significant storage.</p></div></div>`}
const pages={'Dashboard':dashboard,'Goals':goals,'Vision Board':vision,'Planner':planner,'Calendar':calendar,'Habits':habits,'Finances':finances,'Wellness':wellness,'Journal':journal,'Travel':travel,'Learning':learning,'Notes':notes,'Settings':settings};
function render(){const f=pages[page]||dashboard;$('#view').innerHTML=f();$('#crumb').textContent=page.toUpperCase();$('#todayLabel').textContent=new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.title=page+' • '+data.settings.name}
function shiftPlanner(n){const d=new Date(plannerDate+'T12:00:00');d.setDate(d.getDate()+n);plannerDate=d.toISOString().slice(0,10);render()}
function moveMonth(n){const [y,m]=calMonth.split('-').map(Number),d=new Date(y,m-1+n,1);calMonth=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function toggleEvent(id,v){const x=data.events.find(x=>x.id===id);if(x){x.done=v;save();render()}}
function checkHabit(id){const h=data.habits.find(x=>x.id===id);if(!h)return;h.checks=h.checks||[];h.checks=h.checks.includes(today())?h.checks.filter(d=>d!==today()):[...h.checks,today()];save();render()}
const schemas={
goal:{title:'Goal',fields:[['title','Goal name','text'],['category','Life area','select','Personal,Health,Career,Finances,Relationships,Learning,Creativity,Travel'],['date','Target date','date'],['progress','Progress %','number'],['why','Why this matters','textarea'],['next','Next action','text']]},
vision:{title:'Vision board tile',fields:[['title','Vision / affirmation','text'],['note','Description','textarea'],['image','Image from your device (optional)','file']]},
event:{title:'Plan / event',fields:[['title','Title','text'],['date','Date','date'],['time','Time','time'],['category','Category','select','Priority,Work,Personal,Health,Family,Appointment,Focus'],['notes','Details','textarea']]},
habit:{title:'Habit',fields:[['title','Habit name','text'],['frequency','Frequency','select','Daily,Weekdays,Weekly,Custom'],['category','Life area','select','Health,Learning,Wellness,Personal,Work,Home'],['target','Weekly target','number']]},
transaction:{title:'Transaction',fields:[['title','Description','text'],['kind','Type','select','Income,Expense'],['amount','Amount','number'],['date','Date','date'],['category','Category','select','Home,Food,Transport,Health,Shopping,Education,Salary,Savings,Other']]},
bill:{title:'Bill / payment',fields:[['title','Bill name','text'],['amount','Amount','number'],['date','Due date','date'],['status','Status','select','Upcoming,Paid,Overdue'],['category','Category','text']]},
saving:{title:'Savings goal',fields:[['title','Savings goal','text'],['target','Target amount','number'],['saved','Amount saved','number'],['date','Target date','date']]},
wellness:{title:'Wellness check-in',fields:[['date','Date','date'],['mood','Mood','select','Great,Good,Okay,Low,Stressed'],['sleep','Sleep hours','number'],['water','Glasses of water','number'],['movement','Movement / activity','text'],['note','Reflection','textarea']]},
journal:{title:'Journal entry',fields:[['title','Entry title','text'],['kind','Entry type','select','Gratitude,Morning intention,Daily reflection,Evening review,Affirmation,Free writing'],['date','Date','date'],['body','Your entry','textarea']]},
trip:{title:'Trip',fields:[['title','Trip name','text'],['destination','Destination','text'],['start','Start date','date'],['end','End date','date'],['notes','Itinerary / booking notes','textarea'],['packing','Packing list (one item per line)','textarea']]},
course:{title:'Learning item',fields:[['title','Course / book / skill','text'],['category','Type','select','Course,Book,Skill,Class,Project'],['date','Target date','date'],['status','Status','select','Not started,In progress,Completed'],['detail','Notes / next lesson','textarea']]},
note:{title:'Note / list',fields:[['title','Title','text'],['date','Date','date'],['body','Note / checklist','textarea']]}
};
function openAdd(type,prefill=''){showForm(type,null,prefill)}
function editItem(type,id){const arr=collection(type),item=arr.find(x=>x.id===id);if(item)showForm(type,item)}
function collection(type){return ({goal:data.goals,vision:data.vision,event:data.events,habit:data.habits,transaction:data.transactions,bill:data.bills,saving:data.savings,wellness:data.wellness,journal:data.journal,trip:data.trips,course:data.courses,note:data.notes})[type]||[]}
function showForm(type,item,prefill=''){editing={type,id:item?.id||null};const s=schemas[type];$('#modalTitle').textContent=(item?'Edit ':'Add ')+s.title;$('#modalBody').innerHTML=`<form id="itemForm"><div class="form-grid">${s.fields.map(([k,label,t,opt])=>{let v=item?.[k]??(k==='date'?today():k==='progress'?0:'');if(k==='title'&&prefill&&!item)v=prefill;if(t==='select')return `<div class="field"><label>${label}</label><select name="${k}">${opt.split(',').map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></div>`;if(t==='file')return `<div class="field span-all"><label>${label}</label><input name="${k}" type="file" accept="image/*"></div>`;return `<div class="field ${t==='textarea'?'span-all':''}"><label>${label}</label>${t==='textarea'?`<textarea name="${k}">${esc(v)}</textarea>`:`<input name="${k}" type="${t}" value="${esc(v)}" ${k==='progress'?'min="0" max="100"':''}>`}</div>`}).join('')}</div><button class="primary" type="submit">Save ${s.title.toLowerCase()}</button></form>`;
$('#modalBack').style.display='grid';$('#itemForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),obj={};for(const [k,v] of fd.entries()){if(v instanceof File){if(v.size){if(v.size>1500000){toast('Please choose an image under 1.5 MB.');return}obj[k]=await fileData(v)} }else obj[k]=v}for(const [k,v] of Object.entries(obj))if(['amount','target','saved','progress','sleep','water'].includes(k))obj[k]=Number(v)||0;let arr=collection(type),existing=item?arr.find(x=>x.id===item.id):null;if(existing)Object.assign(existing,obj);else arr.push({id:uid(),...obj,done:false,checks:[]});save();closeModal();render();toast('Saved successfully')};}
function fileData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
function closeModal(){$('#modalBack').style.display='none';editing=null}
function removeItem(type,id){if(!confirm('Delete this item?'))return;const a=collection(type);const i=a.findIndex(x=>x.id===id);if(i>=0)a.splice(i,1);save();render();toast('Item deleted')}
function saveSettings(){data.settings.name=$('#setName').value.trim()||'LifeBloom 2027';data.settings.currency=$('#setCurrency').value;save();render();toast('Preferences saved')}
function exportData(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='lifebloom-2027-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.version!==1||!Array.isArray(x.goals)||!Array.isArray(x.events))throw Error();data={...blank(),...x};save();render();toast('Backup imported')}catch(e){toast('That backup file is not valid for LifeBloom.')}};r.readAsText(file)}
function clearData(){if(!confirm('This permanently clears planner data in this browser. Export a backup first. Continue?'))return;data=blank();save();render();toast('Planner reset')}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)nav(b.dataset.page)});
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark');data.settings.theme=document.body.classList.contains('dark')?'dark':'light';save()};
$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
$('#modalClose').onclick=closeModal;$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});
window.openAdd=openAdd;window.editItem=editItem;window.removeItem=removeItem;window.toggleEvent=toggleEvent;window.checkHabit=checkHabit;window.shiftPlanner=shiftPlanner;window.moveMonth=moveMonth;window.saveSettings=saveSettings;window.exportData=exportData;window.importData=importData;window.clearData=clearData;window.nav=nav;
if(data.settings.theme==='dark')document.body.classList.add('dark');render();
})();
</script>
</body></html>
